<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住户管理系统 - 住户中心</title>
    <link rel="stylesheet" href="assets/css/style.css?v=20260731">
    <script src="assets/js/qrcode.min.js"></script>
</head>
<body data-i18n-title="titleResident">
    <div class="admin-container">
        <header class="admin-header">
            <h1 data-i18n="titleResident">住户管理系统 - 住户中心</h1>
            <div class="user-info">
                <div class="lang-switcher" id="langSwitcher">
                    <select id="langSelect" title="Language">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                        <option value="ms">Bahasa Melayu</option>
                    </select>
                </div>
                <span id="residentInfo"></span>
                <a href="manual.html" class="btn btn-outline" data-i18n="userManual">用户手册</a>
                <button id="logoutBtn" class="btn btn-secondary" data-i18n="logout">退出登录</button>
            </div>
        </header>

        <div class="admin-content">
            <section class="section">
                <h2 data-i18n="myProfile">我的资料</h2>
                <div id="residentProfile" class="resident-profile"></div>
            </section>
            <section class="section">
                <h2 data-i18n="residentTodayScanRecords">当天扫描记录</h2>
                <p class="section-hint">
                    <span data-i18n="residentTodayScanHint">以下仅显示您名下二维码当天的访客扫码记录。</span>
                    <a href="resident_records_calendar.html" class="btn btn-outline btn-small" style="margin-left:10px;" data-i18n="viewAllMyScanRecords">查看全部扫描记录（日历）</a>
                    <span id="residentTodayRefreshHint" style="color:#666;font-size:12px;"></span>
                </p>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th data-i18n="id">ID</th>
                                <th data-i18n="nameRemarkCol">名字/备注</th>
                                <th data-i18n="buildingUnit">单元楼</th>
                                <th data-i18n="roomNumber">门牌号</th>
                                <th data-i18n="visitorIP">访客IP</th>
                                <th data-i18n="scanTime">扫描时间</th>
                            </tr>
                        </thead>
                        <tbody id="residentTodayRecordsBody">
                            <tr><td colspan="6" class="loading" data-i18n="loading">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
            <section class="section">
                <h2 data-i18n="myQRCodes">我的二维码</h2>
                <p class="section-hint" data-i18n="residentQRHint">以下为属于您的住户二维码，可出示给访客扫描。</p>
                <div id="qrList" class="qr-list"></div>
            </section>
        </div>
    </div>
    <script src="assets/js/i18n.js?v=20260731"></script>
    <script src="assets/js/resident.js?v=20260310"></script>
    <footer class="site-footer">
        <div class="site-footer-title">Resident Management System</div>
        <div class="site-footer-copy">Copyright &copy; 2026 Desmond Liew. All Rights Reserved.</div>
    </footer>
</body>
</html>
