<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住户管理系统 - 全部扫描记录</title>
    <link rel="stylesheet" href="assets/css/style.css?v=20260616">
</head>
<body data-i18n-title="titleAdminScanRecords">
    <div class="admin-container">
        <header class="admin-header">
            <h1 data-i18n="viewAllScanRecords">全部扫描记录</h1>
            <div class="user-info">
                <div class="lang-switcher" id="langSwitcher">
                    <select id="langSelect" title="Language">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                        <option value="ms">Bahasa Melayu</option>
                    </select>
                </div>
                <a href="admin.html" class="btn btn-outline" data-i18n="backToAdmin">返回管理后台</a>
                <span id="adminUsername"></span>
                <button id="logoutBtn" class="btn btn-secondary" data-i18n="logout">退出登录</button>
            </div>
        </header>

        <div class="admin-content">
            <section class="section">
                <div class="form-row" style="align-items:center; gap:8px; flex-wrap:wrap;">
                    <div class="form-group">
                        <label for="monthInput" data-i18n="monthLabel">月份</label>
                        <input id="monthInput" type="month">
                    </div>
                    <button id="prevMonthBtn" class="btn btn-outline" style="height:42px;" data-i18n="prevMonth">上一月</button>
                    <button id="nextMonthBtn" class="btn btn-outline" style="height:42px;" data-i18n="nextMonth">下一月</button>
                    <button id="currentMonthBtn" class="btn btn-outline" style="height:42px;" data-i18n="currentMonth">本月</button>
                    <button id="reloadCalendarBtn" class="btn btn-primary" style="height:42px;" data-i18n="loadCalendar">加载日历</button>
                </div>
                <div id="recordsCalendarGrid" class="records-calendar-grid"></div>
            </section>
        </div>
    </div>

    <div id="dayRecordsModal" class="records-modal" style="display:none;">
        <div class="records-modal-mask"></div>
        <div class="records-modal-content">
            <div class="records-modal-header">
                <h3 id="dayRecordsTitle">当天扫描记录</h3>
                <button id="closeDayRecordsModal" class="btn btn-secondary btn-small" data-i18n="close">关闭</button>
            </div>
            <div class="form-row" style="align-items:end;">
                <div class="form-group" style="flex:1;">
                    <label for="dayRecordSearchInput" data-i18n="searchButton">搜索</label>
                    <input id="dayRecordSearchInput" type="text" data-i18n-placeholder="searchDayRecordPlaceholder" placeholder="输入姓名或访客IP搜索">
                </div>
            </div>
            <div class="table-container" style="max-height:420px; overflow:auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th data-i18n="id">ID</th>
                            <th data-i18n="nameRemarkCol">名字/备注</th>
                            <th data-i18n="buildingUnit">单元楼</th>
                            <th data-i18n="roomNumber">门牌号</th>
                            <th data-i18n="phoneCol">手机号码</th>
                            <th data-i18n="visitorIP">访客IP</th>
                            <th data-i18n="scanTime">扫描时间</th>
                        </tr>
                    </thead>
                    <tbody id="dayRecordTableBody">
                        <tr><td colspan="7" class="loading" data-i18n="loading">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="assets/js/i18n.js?v=20260731"></script>
    <script src="assets/js/admin_records_calendar.js?v=20260310"></script>
    <footer class="site-footer">
        <div class="site-footer-title">Resident Management System</div>
        <div class="site-footer-copy">Copyright &copy; 2026 Desmond Liew. All Rights Reserved.</div>
    </footer>
</body>
</html>
