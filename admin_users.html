<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住户管理系统 - 用户列表</title>
    <link rel="stylesheet" href="assets/css/style.css?v=20260616">
    <script src="assets/js/qrcode.min.js"></script>
</head>
<body data-i18n-title="titleAdminUsers">
    <div class="admin-container">
        <header class="admin-header">
            <h1 data-i18n="userListPageTitle">用户列表</h1>
            <div class="user-info">
                <div class="lang-switcher" id="langSwitcher">
                    <select id="langSelect" title="Language">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                        <option value="ms">Bahasa Melayu</option>
                    </select>
                </div>
                <a href="admin.html" class="btn btn-outline" data-i18n="backToAdmin">返回管理后台</a>
                <span id="adminUsername"></span>
                <button id="logoutBtn" class="btn btn-secondary" data-i18n="logout">退出登录</button>
            </div>
        </header>

        <div class="admin-content">
            <section class="section">
                <h2 data-i18n="viewAllUsers">查看全部用户</h2>
                <div class="form-row" style="align-items: end;">
                    <div class="form-group" style="flex:1;">
                        <label for="userSearchInput" data-i18n="searchButton">搜索</label>
                        <input id="userSearchInput" type="text" data-i18n-placeholder="searchUserPlaceholder" placeholder="输入姓名/电话/单元楼/门牌号搜索">
                    </div>
                </div>
                <div id="allUsersList" class="qr-list"></div>
            </section>
        </div>

        <div id="editResidentModal" class="records-modal" style="display: none;" aria-hidden="true">
            <div class="records-modal-mask" id="editResidentMask"></div>
            <div class="records-modal-content admin-settings-modal-content edit-resident-modal-content">
                <div class="records-modal-header">
                    <h2 data-i18n="editResidentTitle" style="margin: 0; font-size: 1.15rem;">Edit resident</h2>
                    <button type="button" class="btn btn-secondary btn-small" id="editResidentClose" data-i18n="close">Close</button>
                </div>
                <form id="editResidentForm" class="form-create-qr" style="margin-top: 8px;">
                    <input type="hidden" id="editResidentId" value="">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editResidentName"><span data-i18n="nameRemark">Name</span> <span class="required" data-i18n="required">*</span></label>
                            <input type="text" id="editResidentName" required maxlength="255" data-i18n-placeholder="placeholderName" placeholder="">
                        </div>
                        <div class="form-group">
                            <label for="editResidentBuilding"><span data-i18n="buildingUnit">Building</span> <span class="required" data-i18n="required">*</span></label>
                            <input type="text" id="editResidentBuilding" required data-i18n-placeholder="placeholderBuilding" placeholder="">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editResidentRoom"><span data-i18n="roomNumber">Room</span> <span class="required" data-i18n="required">*</span></label>
                            <input type="text" id="editResidentRoom" required data-i18n-placeholder="placeholderRoom" placeholder="">
                        </div>
                        <div class="form-group">
                            <label for="editResidentDate"><span data-i18n="qrCreatedDate">QR date</span> <span class="required" data-i18n="required">*</span></label>
                            <input type="date" id="editResidentDate" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editResidentPhone"><span data-i18n="phone">Phone</span> <span class="required" data-i18n="required">*</span></label>
                            <input type="text" id="editResidentPhone" required data-i18n-placeholder="placeholderPhone" placeholder="">
                        </div>
                        <div class="form-group">
                            <label for="editResidentUsername" data-i18n="residentUsernameOptional">Login username (optional)</label>
                            <input type="text" id="editResidentUsername" autocomplete="off" data-i18n-placeholder="placeholderResidentUsername" placeholder="">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editResidentPassword" data-i18n="password">Password</label>
                            <input type="password" id="editResidentPassword" autocomplete="new-password" data-i18n-placeholder="placeholderEditResidentPwd" placeholder="">
                        </div>
                    </div>
                    <div id="editResidentError" class="error-message" role="alert"></div>
                    <div class="form-row form-row-submit">
                        <button type="submit" class="btn btn-primary" data-i18n="saveEditResident" style="width: 100%;">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="assets/js/i18n.js?v=20260731"></script>
    <script src="assets/js/edit_resident.js?v=20260313"></script>
    <script src="assets/js/admin_users.js?v=20260313"></script>
    <footer class="site-footer">
        <div class="site-footer-title">Resident Management System</div>
        <div class="site-footer-copy">Copyright &copy; 2026 Desmond Liew. All Rights Reserved.</div>
    </footer>
</body>
</html>
