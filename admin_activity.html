<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住户管理系统 - 操作监控</title>
    <link rel="stylesheet" href="assets/css/style.css?v=20260616">
</head>
<body data-i18n-title="titleActivityMonitor">
    <div class="admin-container">
        <header class="admin-header">
            <h1 data-i18n="activityMonitorTitle">用户操作监控</h1>
            <div class="user-info">
                <div class="lang-switcher" id="langSwitcher">
                    <select id="langSelect" title="Language">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                        <option value="ms">Bahasa Melayu</option>
                    </select>
                </div>
                <a href="admin.html" class="btn btn-outline" data-i18n="backToAdmin">返回管理后台</a>
                <span id="adminUsername"></span>
                <button id="logoutBtn" class="btn btn-secondary" data-i18n="logout">退出登录</button>
            </div>
        </header>

        <div class="admin-content">
            <section class="section">
                <h2 data-i18n="todayActivityLogsTitle">当天用户操作日志</h2>
                <div class="form-row" style="align-items:end;">
                    <div class="form-group" style="flex: 2;">
                        <label for="activitySearchInput" data-i18n="searchButton">搜索</label>
                        <input id="activitySearchInput" type="text" data-i18n-placeholder="activitySearchPlaceholder" placeholder="搜索用户、操作、描述、IP">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="activityRoleSelect" data-i18n="roleLabel">角色</label>
                        <select id="activityRoleSelect">
                            <option value="" data-i18n="allRoles">全部角色</option>
                            <option value="admin">admin</option>
                            <option value="resident">resident</option>
                            <option value="visitor">visitor</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="activityActionInput" data-i18n="actionLabel">操作类型</label>
                        <input id="activityActionInput" type="text" data-i18n-placeholder="activityActionPlaceholder" placeholder="例如：create_qr">
                    </div>
                </div>
                <p class="section-hint" id="activityRefreshHint"></p>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th data-i18n="id">ID</th>
                                <th data-i18n="roleLabel">角色</th>
                                <th data-i18n="userLabel">用户</th>
                                <th data-i18n="actionLabel">操作类型</th>
                                <th data-i18n="targetLabel">目标</th>
                                <th data-i18n="descriptionLabel">说明</th>
                                <th data-i18n="visitorIP">IP</th>
                                <th data-i18n="timeLabel">时间</th>
                            </tr>
                        </thead>
                        <tbody id="activityLogsBody">
                            <tr><td colspan="8" class="loading" data-i18n="loading">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination" id="activityPagination"></div>
            </section>

            <section class="section">
                <h2 data-i18n="activityCalendarTitle">操作日志日历</h2>
                <div class="form-row" style="align-items:center; gap:8px; flex-wrap:wrap;">
                    <div class="form-group">
                        <label for="activityMonthInput" data-i18n="monthLabel">月份</label>
                        <input id="activityMonthInput" type="month">
                    </div>
                    <button id="activityPrevMonthBtn" class="btn btn-outline" style="height:42px;" data-i18n="prevMonth">上一月</button>
                    <button id="activityNextMonthBtn" class="btn btn-outline" style="height:42px;" data-i18n="nextMonth">下一月</button>
                    <button id="activityCurrentMonthBtn" class="btn btn-outline" style="height:42px;" data-i18n="currentMonth">本月</button>
                    <button id="activityReloadCalendarBtn" class="btn btn-primary" style="height:42px;" data-i18n="loadCalendar">加载日历</button>
                </div>
                <div id="activityCalendarGrid" class="records-calendar-grid"></div>
            </section>
        </div>
    </div>

    <div id="activityDayModal" class="records-modal" style="display:none;">
        <div class="records-modal-mask"></div>
        <div class="records-modal-content">
            <div class="records-modal-header">
                <h3 id="activityDayTitle">当天操作日志</h3>
                <button id="closeActivityDayModal" class="btn btn-secondary btn-small" data-i18n="close">关闭</button>
            </div>
            <div class="form-row" style="align-items:end;">
                <div class="form-group" style="flex: 2;">
                    <label for="activityDaySearchInput" data-i18n="searchButton">搜索</label>
                    <input id="activityDaySearchInput" type="text" data-i18n-placeholder="activitySearchPlaceholder" placeholder="搜索用户、操作、描述、IP">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="activityDayRoleSelect" data-i18n="roleLabel">角色</label>
                    <select id="activityDayRoleSelect">
                        <option value="" data-i18n="allRoles">全部角色</option>
                        <option value="admin">admin</option>
                        <option value="resident">resident</option>
                        <option value="visitor">visitor</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="activityDayActionInput" data-i18n="actionLabel">操作类型</label>
                    <input id="activityDayActionInput" type="text" data-i18n-placeholder="activityActionPlaceholder" placeholder="例如：create_qr">
                </div>
            </div>
            <div class="table-container" style="max-height:420px; overflow:auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th data-i18n="id">ID</th>
                            <th data-i18n="roleLabel">角色</th>
                            <th data-i18n="userLabel">用户</th>
                            <th data-i18n="actionLabel">操作类型</th>
                            <th data-i18n="targetLabel">目标</th>
                            <th data-i18n="descriptionLabel">说明</th>
                            <th data-i18n="visitorIP">IP</th>
                            <th data-i18n="timeLabel">时间</th>
                        </tr>
                    </thead>
                    <tbody id="activityDayLogsBody">
                        <tr><td colspan="8" class="loading" data-i18n="loading">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="assets/js/i18n.js?v=20260731"></script>
    <script src="assets/js/admin_activity.js?v=20260316"></script>
    <footer class="site-footer">
        <div class="site-footer-title">Resident Management System</div>
        <div class="site-footer-copy">Copyright &copy; 2026 Desmond Liew. All Rights Reserved.</div>
    </footer>
</body>
</html>
