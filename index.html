<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住户管理系统 - 登录</title>
    <link rel="stylesheet" href="assets/css/style.css?v=20260731">
</head>
<body data-i18n-title="titleLogin">
    <div class="login-container">
        <div class="login-box login-box-wide" style="position: relative;">
            <div class="lang-switcher" id="langSwitcher">
                <select id="langSelect" title="Language">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                    <option value="ms">Bahasa Melayu</option>
                </select>
            </div>
            <h1 data-i18n="appTitle">住户管理系统</h1>
            <div class="login-tabs">
                <button type="button" class="login-tab active" data-tab="admin" data-i18n="adminLogin">管理员登录</button>
                <button type="button" class="login-tab" data-tab="resident" data-i18n="residentLogin">住户登录</button>
            </div>

            <form id="loginFormAdmin" class="login-form">
                <div class="form-group">
                    <label for="username" data-i18n="username">用户名</label>
                    <input type="text" id="username" name="username" autocomplete="username" value="admin" data-i18n-placeholder="placeholderAdminUser" placeholder="管理员账号">
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="password">密码</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" value="admin123" data-i18n-placeholder="placeholderAdminPwd" placeholder="管理员密码">
                </div>
                <button type="submit" class="btn btn-primary" data-i18n="login">登录</button>
                <div id="loginErrorAdmin" class="error-message"></div>
                <p class="forgot-password-row">
                    <a href="#" id="forgotPasswordLink" data-i18n="forgotPassword">Forgot password?</a>
                </p>
            </form>

            <form id="loginFormResident" class="login-form" style="display: none;">
                <div class="form-group">
                    <label for="residentAccount" data-i18n="residentLoginAccount">电话号码或用户名</label>
                    <input type="text" id="residentAccount" name="account" autocomplete="username" data-i18n-placeholder="placeholderResidentAccount" placeholder="电话号码或用户名">
                </div>
                <div class="form-group">
                    <label for="residentPassword" data-i18n="password">密码</label>
                    <input type="password" id="residentPassword" name="password" autocomplete="current-password" data-i18n-placeholder="placeholderResidentPwd" placeholder="创建二维码时设置的密码">
                </div>
                <button type="submit" class="btn btn-primary" data-i18n="login">登录</button>
                <div id="loginErrorResident" class="error-message"></div>
            </form>

            <div style="margin-top: 12px;">
                <a href="scan.php" target="_blank" class="btn btn-outline" data-i18n="goScanPage" style="display:block; text-align:center;">进入扫描页面</a>
            </div>
            <p class="manual-link-row">
                <a href="manual.html" data-i18n="userManual">用户手册</a>
            </p>
        </div>
    </div>

    <div id="forgotPasswordModal" class="records-modal" style="display: none;" aria-hidden="true">
        <div class="records-modal-mask" id="forgotPasswordMask"></div>
        <div class="records-modal-content admin-settings-modal-content forgot-password-modal-content">
            <div class="records-modal-header">
                <h2 data-i18n="forgotPasswordTitle" style="margin: 0; font-size: 1.15rem;">Forgot password</h2>
                <button type="button" class="btn btn-secondary btn-small" id="forgotPasswordClose" data-i18n="close">Close</button>
            </div>
            <div id="forgotStep1">
                <p class="settings-hint" data-i18n="forgotPasswordStep1Hint"></p>
                <div class="form-group">
                    <label for="forgotEmail" data-i18n="forgotRegisteredEmail">Email</label>
                    <input type="email" id="forgotEmail" autocomplete="email" maxlength="255">
                </div>
                <div id="forgotError" class="error-message" role="alert"></div>
                <button type="button" class="btn btn-primary" id="forgotSendCode" style="width: 100%;" data-i18n="sendVerificationCode">Send code</button>
            </div>
            <div id="forgotStep2" style="display: none;">
                <p class="settings-hint" data-i18n="forgotPasswordStep2Hint"></p>
                <p class="settings-hint" id="forgotStep2EmailLine" style="font-weight: 600;"></p>
                <input type="hidden" id="forgotEmailHidden" value="">
                <div class="form-group">
                    <label for="forgotCode" data-i18n="verificationCode">Code</label>
                    <input type="text" id="forgotCode" inputmode="numeric" maxlength="6" pattern="[0-9]*" autocomplete="one-time-code">
                </div>
                <div class="form-group">
                    <label for="forgotNewPassword" data-i18n="forgotNewPassLabel">New password</label>
                    <input type="password" id="forgotNewPassword" autocomplete="new-password" minlength="6">
                </div>
                <div class="form-group">
                    <label for="forgotConfirmPassword" data-i18n="confirmNewPassword">Confirm</label>
                    <input type="password" id="forgotConfirmPassword" autocomplete="new-password" minlength="6">
                </div>
                <div id="forgotError2" class="error-message" role="alert"></div>
                <button type="button" class="btn btn-primary" id="forgotVerifyBtn" style="width: 100%; margin-bottom: 8px;" data-i18n="verifyAndResetPassword">Verify and reset</button>
                <p style="text-align: center; margin: 0;"><a href="#" id="forgotStartOver" data-i18n="forgotStartOver">Start over</a></p>
            </div>
        </div>
    </div>
    <script src="assets/js/i18n.js?v=20260731"></script>
    <script src="assets/js/login.js?v=20260314"></script>
    <footer class="site-footer">
        <div class="site-footer-title">Resident Management System</div>
        <div class="site-footer-copy">Copyright &copy; 2026 Desmond Liew. All Rights Reserved.</div>
    </footer>
</body>
</html>
